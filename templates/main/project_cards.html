<div class="projects-grid">
  {% for project in projects %}
    <article class="project-card">
      <div class="project-art {{ project.theme }}-art" aria-hidden="true">
        <span class="art-kicker">{{ project.label }}</span>
        <div class="project-headline">{{ project.headline }}</div>
        <div class="art-bottom"><span>{{ project.caption }}</span><span>{{ forloop.counter|stringformat:"02d" }} ↗</span></div>
      </div>
      <div class="project-content">
        <p class="eyebrow">{{ project.category }}</p>
        <h3>{{ project.title }}</h3>
        <p>{{ project.description }}</p>
        <div class="tags">{% for tag in project.tags %}<span>{{ tag }}</span>{% endfor %}</div>
        <a class="text-link" href="{{ project.url }}">Explore the repository <span aria-hidden="true">↗</span></a>
      </div>
    </article>
  {% endfor %}
</div>
